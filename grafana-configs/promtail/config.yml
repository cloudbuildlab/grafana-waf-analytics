server:
  disable: true

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1024
    timeout: 10s
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: waf
    static_configs:
      - targets: [localhost]
        labels:
          job: waf
          __path__: /mnt/data/waf-logs/**/*.log
    pipeline_stages:
      - json:
          expressions:
            ts: timestamp
            country: httpRequest.country
            clientIp: httpRequest.clientIp
            action: action
            terminatingRuleId: terminatingRuleId
            httpMethod: httpRequest.httpMethod
            uri: httpRequest.uri
            host: httpRequest.host
      - timestamp:
          source: ts
          format: UnixMs
      - labels:
          country:
          clientIp:
          action:
          terminatingRuleId:
          httpMethod:
          uri:
          host:
